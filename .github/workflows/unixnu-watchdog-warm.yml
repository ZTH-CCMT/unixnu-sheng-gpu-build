name: UniXNU frozen C9 watchdog trace diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/unixnu-watchdog-warm.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: unixnu-os17-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watchdog-diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Diagnose UniXNU host watchdog with authenticated C9 frozen binaries 20261103'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plan
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install frozen host driver runtime dependency
        run: brew install spirv-tools
      - name: Trace original watchdog gate using exact C9 binaries
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 -B plan/ci/warm_watchdog.py --work watchdog-frozen-work --output watchdog-diagnostic-artifact
      - name: Upload bounded text diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unixnu-C9-watchdog-DIAGNOSTIC-NOT-INSTALL-READY-${{ github.run_id }}
          path: watchdog-diagnostic-artifact/
          if-no-files-found: ignore
          retention-days: 7
