name: UniXNU frozen host trace and conditional VA control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/unixnu-hostdiag-warm.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: unixnu-os17-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hostdiag-only:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trace frozen C4 host GPU and conditionally verify current VA layout 20261102'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plan
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df1f751d98540fa12f839881b1c7cfc613595bdb
          path: source-c4
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 6790e7ce6e77f67a9174fba1255e64eacf1c41ad
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install only existing host runtime dependency bottle
        run: brew install --force-bottle spirv-tools
      - name: Authenticate frozen C4 and run guarded host diagnostic A/B
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 plan/ci/warm_host_diag.py --source-plan source-c4 --upstream upstream --output hostdiag-artifact
      - name: Upload host diagnostic logs and identities only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unixnu-HOSTDIAG-ONLY-NOT-INSTALL-READY-${{ github.run_id }}
          path: hostdiag-artifact/
          if-no-files-found: ignore
          retention-days: 7
