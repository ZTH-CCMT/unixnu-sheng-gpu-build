name: UniXNU frozen C6 QuartzCore diagnostic only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/unixnu-quartzcore-warm.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: unixnu-os17-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quartzcore-only:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Diagnose original QuartzCore control with frozen C6 host components 20261102'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plan
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7af1cc59c8241393e381ddafe20590d47e9db53d
          path: source-c6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 6790e7ce6e77f67a9174fba1255e64eacf1c41ad
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 28b30285768e04008ac525c04182e245bfac441e
          path: device
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install only the recorded host runtime dependency bottle
        run: brew install --force-bottle spirv-tools
      - name: Authenticate frozen C6 and run the original QuartzCore checker directly
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 plan/ci/warm_quartzcore.py --source-plan source-c6 --upstream upstream --device device --output quartzcore-diagnostic-artifact
      - name: Upload exact diagnostic text and identity reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unixnu-QUARTZCORE-DIAG-ONLY-NOT-INSTALL-READY-${{ github.run_id }}
          path: quartzcore-diagnostic-artifact/
          if-no-files-found: ignore
          retention-days: 7
