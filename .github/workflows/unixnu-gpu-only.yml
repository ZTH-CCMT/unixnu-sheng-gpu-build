name: UniXNU OS17 GPU components only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/unixnu-gpu-only.yml"]
permissions:
  contents: read
concurrency:
  group: unixnu-os17-gpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gpu-components:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Fix host fixture and resume UniXNU OS17 GPU build 20261102'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      CARGO_BUILD_JOBS: "1"
      RUSTUP_TOOLCHAIN: "1.98.0"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plan
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 6790e7ce6e77f67a9174fba1255e64eacf1c41ad
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 28b30285768e04008ac525c04182e245bfac441e
          path: device
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install actual macOS build tools
        run: |
          brew install llvm ninja cmake glslang shaderc spirv-tools vulkan-headers bison pkgconf rustup
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$(brew --prefix rustup)/bin/rustup" toolchain install 1.98.0 --profile minimal
          "$(brew --prefix rustup)/bin/rustup" target add --toolchain 1.98.0 aarch64-apple-ios
      - name: Build and validate components
        run: python3 plan/ci/build_gpu_only.py --root upstream --device device --output component-artifact
      - name: Upload self-built candidate components
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unixnu-os17-gpu-CANDIDATE-${{ github.run_id }}
          path: component-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unixnu-os17-gpu-failed-logs-${{ github.run_id }}
          path: component-artifact/logs/
          if-no-files-found: ignore
          retention-days: 7
